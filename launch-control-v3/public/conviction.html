<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Control — Conviction Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:     #060a0f;
  --bg1:     #0b1118;
  --bg2:     #111a24;
  --bg3:     #182030;
  --border:  #1e2d3d;
  --border2: #243547;
  --amber:   #f59e0b;
  --amber2:  #fbbf24;
  --green:   #10b981;
  --green2:  #34d399;
  --red:     #ef4444;
  --blue:    #3b82f6;
  --purple:  #8b5cf6;
  --text1:   #e2e8f0;
  --text2:   #a8b8c8;
  --text3:   #6b7f94;
  --text4:   #3d5068;
  --mono:    'IBM Plex Mono', monospace;
  --sans:    'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg0); color: var(--text1); font-family: var(--sans); font-size: 13px; }

/* Scanlines */
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: var(--bg0); } ::-webkit-scrollbar-thumb { background: var(--border2); }

/* ── HEADER ── */
#header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 44px;
  background: var(--bg1); border-bottom: 1px solid var(--border);
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  letter-spacing: 3px; color: var(--amber);
}
.logo-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--amber);
  animation: glow 2s ease-in-out infinite;
}
@keyframes glow { 0%,100%{box-shadow:0 0 4px var(--amber)}50%{box-shadow:0 0 14px var(--amber),0 0 28px #92400e} }

.header-right { display: flex; align-items: center; gap: 12px; }

.nav-link {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: 1px; color: var(--text3); text-decoration: none;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 3px;
  transition: all 0.15s;
}
.nav-link:hover { color: var(--amber); border-color: var(--amber); }

.clock { font-family: var(--mono); font-size: 10px; color: var(--text3); }

.badge {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 3px; letter-spacing: 1px;
}
.badge-red    { background: #7f1d1d40; color: var(--red);    border: 1px solid var(--red); }
.badge-amber  { background: #92400e40; color: var(--amber);  border: 1px solid var(--amber); }
.badge-muted  { background: var(--bg2); color: var(--text3); border: 1px solid var(--border); }

/* ── CONTENT ── */
#content { padding: 16px; max-width: 1200px; margin: 0 auto; }

.section-title {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: 2px; color: var(--text3); margin: 24px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title:first-child { margin-top: 8px; }
.section-dot { width: 6px; height: 6px; border-radius: 50%; }
.section-count {
  font-size: 9px; font-weight: 700; padding: 2px 6px;
  border-radius: 3px; margin-left: 4px;
}

/* ── CARD GRID ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
  gap: 12px;
}
@media(max-width: 560px) { .card-grid { grid-template-columns: 1fr; } }

/* ── CARD ── */
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 6px; padding: 16px;
  animation: slideIn 0.2s ease;
}
@keyframes slideIn { from{transform:translateY(-6px);opacity:0} to{transform:translateY(0);opacity:1} }
.card.strong-put { border-left-color: var(--red); }
.card.monitor    { border-left-color: var(--amber); }

.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.card-ticker {
  font-family: var(--mono); font-size: 20px; font-weight: 700;
  color: var(--text1);
}

/* Score bar */
.score-bar-container {
  margin-bottom: 14px;
}
.score-bar-label {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: 1px; color: var(--text3); margin-bottom: 4px;
  display: flex; justify-content: space-between;
}
.score-bar-track {
  height: 8px; background: var(--bg0); border-radius: 4px; overflow: hidden;
  border: 1px solid var(--border);
}
.score-bar-fill {
  height: 100%; border-radius: 4px; transition: width 0.6s ease;
}
.score-bar-fill.red   { background: linear-gradient(90deg, #dc2626, #ef4444); }
.score-bar-fill.amber { background: linear-gradient(90deg, #d97706, #f59e0b); }

/* Details grid */
.details-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px 16px; margin-bottom: 12px;
}
.detail-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; border-bottom: 1px solid var(--border);
}
.detail-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
  color: var(--text3); text-transform: uppercase;
}
.detail-value {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--text2);
}
.detail-value.warn { color: var(--red); }
.detail-value.ok   { color: var(--green); }
.detail-value.highlight { color: var(--amber); }

/* Risk factors */
.risk-section {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.risk-title {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: 1px; color: var(--text3); margin-bottom: 6px;
}
.risk-list { list-style: none; padding: 0; }
.risk-list li {
  font-size: 11px; color: var(--text2); padding: 2px 0;
  display: flex; align-items: baseline; gap: 6px;
}
.risk-list li::before {
  content: ''; display: inline-block; flex-shrink: 0;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--red); margin-top: 5px;
}

/* Trade guidance */
.trade-guidance {
  margin-top: 10px; padding: 8px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px;
  font-family: var(--mono); font-size: 10px; color: var(--text2);
  letter-spacing: 0.5px;
}
.trade-guidance strong { color: var(--amber); }

/* Red flag filings */
.redflag-section {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.redflag-title {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  letter-spacing: 1px; color: var(--red); margin-bottom: 6px;
}
.redflag-item {
  padding: 6px 8px; margin-bottom: 4px;
  background: #7f1d1d20; border: 1px solid #7f1d1d50;
  border-radius: 4px;
}
.redflag-item-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2px;
}
.redflag-date {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
}
.redflag-severity {
  font-family: var(--mono); font-size: 9px; font-weight: 700;
  padding: 1px 5px; border-radius: 2px; letter-spacing: 0.5px;
}
.redflag-severity.HIGH   { background: #dc262640; color: #fca5a5; border: 1px solid #dc2626; }
.redflag-severity.MEDIUM { background: #d9770640; color: #fcd34d; border: 1px solid #d97706; }
.redflag-severity.LOW    { background: #1e40af40; color: #93c5fd; border: 1px solid #3b82f6; }
.redflag-reason {
  font-size: 11px; color: var(--text2); line-height: 1.4;
}
.redflag-link {
  font-family: var(--mono); font-size: 9px; color: var(--text4);
  text-decoration: none; margin-top: 2px; display: inline-block;
}
.redflag-link:hover { color: var(--text3); }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text3);
}
.empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
.empty-state-title {
  font-family: var(--mono); font-size: 14px; font-weight: 700;
  letter-spacing: 2px; margin-bottom: 6px;
}
.empty-state-sub { font-size: 12px; }

/* Loading */
.loading {
  text-align: center; padding: 60px 20px;
  font-family: var(--mono); font-size: 11px;
  color: var(--text3); letter-spacing: 1px;
}
.loading-dot { display: inline-block; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
</style>
</head>
<body>

<div id="header">
  <div class="logo">
    <div class="logo-dot"></div>
    LAUNCH CONTROL
    <span style="font-size:9px;color:var(--text3);font-weight:400;letter-spacing:1px">CONVICTION SCANNER</span>
  </div>
  <div class="header-right">
    <a href="/" class="nav-link">DASHBOARD</a>
    <span id="lastUpdated" class="clock">Last updated: --:--:--</span>
  </div>
</div>

<div id="content">
  <div id="loading" class="loading">
    <span class="loading-dot">SCANNING CONVICTION UNIVERSE</span>
  </div>

  <div id="results" style="display:none">
    <!-- STRONG PUT section -->
    <div id="strongPutSection" style="display:none">
      <div class="section-title">
        <span class="section-dot" style="background:var(--red)"></span>
        STRONG PUT
        <span id="strongPutCount" class="section-count badge-red"></span>
      </div>
      <div id="strongPutGrid" class="card-grid"></div>
    </div>

    <!-- MONITOR section -->
    <div id="monitorSection" style="display:none">
      <div class="section-title">
        <span class="section-dot" style="background:var(--amber)"></span>
        MONITOR
        <span id="monitorCount" class="section-count badge-amber"></span>
      </div>
      <div id="monitorGrid" class="card-grid"></div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-state-icon">&#x25CE;</div>
      <div class="empty-state-title">NO SIGNALS</div>
      <div class="empty-state-sub">No tickers currently meet the conviction threshold (score &ge; 50)</div>
    </div>
  </div>
</div>

<script>
(async function init() {
  try {
    const resp = await fetch('/api/conviction');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    document.getElementById('lastUpdated').textContent =
      'Last updated: ' + new Date().toLocaleTimeString('en-US', { hour12: false });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('results').style.display = 'block';

    if (!data.results || data.results.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      return;
    }

    const strongPuts = data.results.filter(r => r.recommendation === 'STRONG_PUT');
    const monitors  = data.results.filter(r => r.recommendation === 'MONITOR');

    if (strongPuts.length > 0) {
      document.getElementById('strongPutSection').style.display = 'block';
      document.getElementById('strongPutCount').textContent = strongPuts.length;
      const grid = document.getElementById('strongPutGrid');
      strongPuts.forEach(r => grid.appendChild(buildCard(r)));
    }

    if (monitors.length > 0) {
      document.getElementById('monitorSection').style.display = 'block';
      document.getElementById('monitorCount').textContent = monitors.length;
      const grid = document.getElementById('monitorGrid');
      monitors.forEach(r => grid.appendChild(buildCard(r)));
    }

    if (strongPuts.length === 0 && monitors.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
    }

  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<span style="color:var(--red)">ERROR: ${err.message}</span>`;
  }
})();

function buildCard(r) {
  const isStrong = r.recommendation === 'STRONG_PUT';
  const cardClass = isStrong ? 'strong-put' : 'monitor';
  const barClass  = isStrong ? 'red' : 'amber';
  const badgeClass = isStrong ? 'badge-red' : r.recommendation === 'MONITOR' ? 'badge-amber' : 'badge-muted';

  const card = document.createElement('div');
  card.className = `card ${cardClass}`;

  const daysEarnings = r.days_to_earnings != null ? `${r.days_to_earnings}d` : '--';
  const ivRank = r.iv_rank_30d != null ? `${r.iv_rank_30d.toFixed(0)}%` : '--';
  const revDecline = r.revenue_declining_quarters != null ? `${r.revenue_declining_quarters}Q` : '--';
  const fcfStatus = r.is_fcf_negative ? 'NEGATIVE' : 'POSITIVE';
  const fcfClass  = r.is_fcf_negative ? 'warn' : 'ok';

  // Insider details
  const insiderSelling = r.net_discretionary_selling != null
    ? '$' + (r.net_discretionary_selling / 1e6).toFixed(1) + 'M'
    : '--';
  const insiderSignal = r.insider_signal || '--';

  // Red flags
  const redFlags = r.red_flag_count != null ? r.red_flag_count : 0;

  // Risk factors HTML
  let riskHtml = '';
  if (r.top_risk_factors && r.top_risk_factors.length > 0) {
    riskHtml = `
      <div class="risk-section">
        <div class="risk-title">RISK FACTORS</div>
        <ul class="risk-list">
          ${r.top_risk_factors.map(f => `<li>${escapeHtml(f)}</li>`).join('')}
        </ul>
      </div>`;
  }

  card.innerHTML = `
    <div class="card-header">
      <span class="card-ticker">${escapeHtml(r.ticker)}</span>
      <span class="badge ${badgeClass}">${r.recommendation.replace('_', ' ')}</span>
    </div>

    <div class="score-bar-container">
      <div class="score-bar-label">
        <span>CONVICTION SCORE</span>
        <span>${r.conviction_score}/100</span>
      </div>
      <div class="score-bar-track">
        <div class="score-bar-fill ${barClass}" style="width:${r.conviction_score}%"></div>
      </div>
    </div>

    <div class="details-grid">
      <div class="detail-item">
        <span class="detail-label">Earnings</span>
        <span class="detail-value ${r.days_to_earnings != null && r.days_to_earnings <= 14 ? 'highlight' : ''}">${daysEarnings}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">IV Rank</span>
        <span class="detail-value">${ivRank}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Rev Decline</span>
        <span class="detail-value ${r.revenue_declining_quarters >= 2 ? 'warn' : ''}">${revDecline}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">FCF</span>
        <span class="detail-value ${fcfClass}">${fcfStatus}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Insider Sell</span>
        <span class="detail-value ${r.net_discretionary_selling > 0 ? 'warn' : ''}">${insiderSelling}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Insider Signal</span>
        <span class="detail-value">${escapeHtml(insiderSignal)}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">8-K Red Flags</span>
        <span class="detail-value ${redFlags > 0 ? 'warn' : 'ok'}">${redFlags}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">PT (Analyst)</span>
        <span class="detail-value">${r.analyst_price_target != null ? '$' + parseFloat(r.analyst_price_target).toFixed(2) : '--'}</span>
      </div>
    </div>

    ${riskHtml}
    ${buildRedFlagFilingsHtml(r.eight_k_red_flags)}

    <div class="trade-guidance">
      <strong>TRADE:</strong> 30-45 DTE, 5-10% OTM PUT
    </div>
  `;

  return card;
}

function buildRedFlagFilingsHtml(flags) {
  if (!flags || flags.length === 0) return '';
  const items = flags.map(f => `
    <div class="redflag-item">
      <div class="redflag-item-header">
        <span class="redflag-date">${escapeHtml(f.filing_date)}</span>
        <span class="redflag-severity ${escapeHtml(f.severity || '')}">${escapeHtml(f.severity || 'UNKNOWN')}</span>
      </div>
      <div class="redflag-reason">${escapeHtml(f.reason || 'Red flag detected')}</div>
      ${f.document_url ? `<a class="redflag-link" href="${escapeHtml(f.document_url)}" target="_blank" rel="noopener">VIEW FILING &rarr;</a>` : ''}
    </div>
  `).join('');
  return `
    <div class="redflag-section">
      <div class="redflag-title">RED FLAG FILINGS (${flags.length})</div>
      ${items}
    </div>`;
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
