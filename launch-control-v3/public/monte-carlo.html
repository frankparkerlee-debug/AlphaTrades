<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Control v3 — Monte Carlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:     #060a0f;
  --bg1:     #0b1118;
  --bg2:     #111a24;
  --bg3:     #182030;
  --border:  #1e2d3d;
  --border2: #243547;
  --amber:   #f59e0b;
  --amber2:  #fbbf24;
  --green:   #10b981;
  --green2:  #34d399;
  --red:     #ef4444;
  --blue:    #3b82f6;
  --purple:  #8b5cf6;
  --cyan:    #06b6d4;
  --text1:   #e2e8f0;
  --text2:   #a8b8c8;
  --text3:   #6b7f94;
  --text4:   #3d5068;
  --mono:    'IBM Plex Mono', monospace;
  --sans:    'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg0); color: var(--text1); font-family: var(--sans); font-size: 13px; }
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
}
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-track { background: var(--bg0); } ::-webkit-scrollbar-thumb { background: var(--border2); }

#header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 44px;
  background: var(--bg1); border-bottom: 1px solid var(--border);
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  letter-spacing: 3px; color: var(--amber);
}
.logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--purple); }
.nav-links { display: flex; gap: 12px; }
.nav-link {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
  text-decoration: none; letter-spacing: 1px;
}
.nav-link:hover { color: var(--amber); }

.container { max-width: 1200px; margin: 0 auto; padding: 16px; }

/* Stat cards */
.stat-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 10px 16px; min-width: 110px; flex: 1; }
.stat-label { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--amber); }
.stat-value.pos { color: var(--green); }
.stat-value.neg { color: var(--red); }
.stat-sub { font-family: var(--mono); font-size: 9px; color: var(--text3); margin-top: 2px; }

.section { background: var(--bg1); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin-bottom: 16px; }
.section-title { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text3); margin-bottom: 12px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media(max-width:700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

.data-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
.data-table th {
  text-align: left; padding: 6px 8px; font-size: 8px; font-weight: 700;
  letter-spacing: 1px; color: var(--text3); border-bottom: 1px solid var(--border);
  text-transform: uppercase;
}
.data-table td { padding: 5px 8px; border-bottom: 1px solid var(--bg3); color: var(--text2); }
.data-table tr:hover td { background: var(--bg2); }
.pos { color: var(--green); }
.neg { color: var(--red); }

/* Probability gauge */
.gauge-bar { height: 28px; background: var(--bg3); border-radius: 4px; overflow: hidden; position: relative; margin: 4px 0; }
.gauge-fill { height: 100%; border-radius: 4px 0 0 4px; transition: width 0.5s; }
.gauge-label {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text1);
}

/* Chart containers */
.chart-svg { width: 100%; }

/* Empty state */
.empty { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-text { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; margin-bottom: 8px; }
.empty-sub { font-size: 11px; }

/* Badge */
.badge {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
}
.badge-green { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.badge-red { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.badge-amber { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.badge-purple { background: rgba(139,92,246,0.15); color: var(--purple); border: 1px solid rgba(139,92,246,0.3); }
</style>
</head>
<body>

<div id="header">
  <div class="logo"><div class="logo-dot"></div>LAUNCH CONTROL — MONTE CARLO</div>
  <div class="nav-links">
    <a href="/backtest" class="nav-link">BACKTEST</a>
    <a href="/" class="nav-link">DASHBOARD</a>
  </div>
</div>

<div class="container" id="main">
  <div class="empty" id="loading">
    <div class="empty-text">LOADING SIMULATION DATA...</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n >= 0 ? `+$${Math.abs(n).toLocaleString()}` : `-$${Math.abs(n).toLocaleString()}`;
const pct = n => `${n >= 0 ? '+' : ''}${n.toFixed(1)}%`;

async function load() {
  try {
    const res = await fetch('/api/backtest/monte-carlo');
    const data = await res.json();
    if (!data.monteCarlo || data.monteCarlo.error) {
      $('loading').innerHTML = `
        <div class="empty-text">NO SIMULATION DATA</div>
        <div class="empty-sub">${data.monteCarlo?.error || 'Run a backtest first to generate Monte Carlo results.'}</div>
        <div style="margin-top:12px"><a href="/backtest" class="nav-link" style="color:var(--amber)">Go to Backtest</a></div>
      `;
      return;
    }
    render(data);
  } catch (e) {
    $('loading').innerHTML = `<div class="empty-text">Error: ${e.message}</div>`;
  }
}

function render(data) {
  const mc = data.monteCarlo;
  const base = mc.base;
  const stress = mc.stress;
  const stats = mc.tradeStats;
  const cfg = mc.config;

  let html = '';

  // ── Config banner
  html += `<div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:12px">
    ${cfg.iterations.toLocaleString()} SIMULATIONS | ${cfg.simDays} DAYS EACH | ${cfg.signalCount} HISTORICAL TRADES | ${cfg.tradingDays} TRADING DAYS | $${cfg.accountSize.toLocaleString()} ACCOUNT
    <span style="margin-left:16px;color:var(--text4)">Last run: ${data.lastRun ? new Date(data.lastRun).toLocaleString() : 'unknown'}</span>
  </div>`;

  // ── Probability cards
  html += `<div class="stat-row">
    <div class="stat">
      <div class="stat-label">PROBABILITY OF PROFIT</div>
      <div class="stat-value ${base.probability.profit >= 50 ? 'pos' : 'neg'}">${base.probability.profit}%</div>
      <div class="stat-sub">${cfg.simDays}-day window</div>
    </div>
    <div class="stat">
      <div class="stat-label">EXPECTED P&L</div>
      <div class="stat-value ${base.pnl.median >= 0 ? 'pos' : 'neg'}">${fmt(base.pnl.median)}</div>
      <div class="stat-sub">median outcome</div>
    </div>
    <div class="stat">
      <div class="stat-label">5TH PERCENTILE</div>
      <div class="stat-value neg">${fmt(base.pnl.percentiles[5])}</div>
      <div class="stat-sub">worst realistic</div>
    </div>
    <div class="stat">
      <div class="stat-label">95TH PERCENTILE</div>
      <div class="stat-value pos">${fmt(base.pnl.percentiles[95])}</div>
      <div class="stat-sub">best realistic</div>
    </div>
    <div class="stat">
      <div class="stat-label">P(RUIN &lt;-15%)</div>
      <div class="stat-value ${base.probability.ruin < 5 ? 'pos' : 'neg'}">${base.probability.ruin}%</div>
      <div class="stat-sub">catastrophic loss</div>
    </div>
    <div class="stat">
      <div class="stat-label">KELLY FRACTION</div>
      <div class="stat-value" style="color:var(--cyan)">${stats.kellyPct}%</div>
      <div class="stat-sub">optimal sizing</div>
    </div>
  </div>`;

  // ── Probability gauges
  html += `<div class="section">
    <div class="section-title">PROBABILITY GAUGES</div>
    <div style="margin-bottom:8px;font-family:var(--mono);font-size:9px;color:var(--text3)">P(Profit over ${cfg.simDays} days)</div>
    ${renderGauge(base.probability.profit, 'var(--green)')}
    <div style="margin-top:12px;margin-bottom:8px;font-family:var(--mono);font-size:9px;color:var(--text3)">P(Return &gt; 10%)</div>
    ${renderGauge(base.probability.return10pct, 'var(--blue)')}
    <div style="margin-top:12px;margin-bottom:8px;font-family:var(--mono);font-size:9px;color:var(--text3)">P(Ruin &lt; -15%)</div>
    ${renderGauge(base.probability.ruin, 'var(--red)')}
  </div>`;

  // ── Fan chart (equity paths)
  html += `<div class="section">
    <div class="section-title">SIMULATION PATHS (${base.paths?.length || 0} SAMPLE RUNS)</div>
    ${renderFanChart(base.paths, base.pnl.percentiles, cfg.simDays)}
  </div>`;

  // ── P&L distribution histogram
  html += `<div class="section">
    <div class="section-title">P&L DISTRIBUTION (${cfg.iterations.toLocaleString()} SIMULATIONS)</div>
    ${renderHistogram(base.histogram)}
  </div>`;

  // ── Risk metrics + percentiles side by side
  html += `<div class="grid-2">`;

  // Risk metrics
  html += `<div class="section">
    <div class="section-title">RISK METRICS</div>
    <table class="data-table">
      <tr><td>Sharpe Ratio</td><td style="text-align:right"><span class="${stats.sharpe > 0 ? 'pos' : 'neg'}">${stats.sharpe}</span></td></tr>
      <tr><td>Sortino Ratio</td><td style="text-align:right"><span class="${stats.sortino > 0 ? 'pos' : 'neg'}">${stats.sortino}</span></td></tr>
      <tr><td>Profit Factor</td><td style="text-align:right">${stats.profitFactor}</td></tr>
      <tr><td>Expectancy / Trade</td><td style="text-align:right"><span class="${stats.expectancy >= 0 ? 'pos' : 'neg'}">${fmt(stats.expectancy)}</span></td></tr>
      <tr><td>Kelly Fraction</td><td style="text-align:right">${stats.kellyPct}%</td></tr>
      <tr><td>Win Rate</td><td style="text-align:right">${stats.winRate}%</td></tr>
      <tr><td>Avg Win</td><td style="text-align:right" class="pos">${fmt(stats.avgWin)}</td></tr>
      <tr><td>Avg Loss</td><td style="text-align:right" class="neg">${fmt(stats.avgLoss)}</td></tr>
      <tr><td>Daily P&L StdDev</td><td style="text-align:right">${fmt(base.daily.stddev)}</td></tr>
      <tr><td>Mean Max Drawdown</td><td style="text-align:right" class="neg">${fmt(base.drawdown.mean)}</td></tr>
      <tr><td>Worst 1% Drawdown</td><td style="text-align:right" class="neg">${fmt(base.drawdown.worst1)}</td></tr>
    </table>
  </div>`;

  // Percentile table
  html += `<div class="section">
    <div class="section-title">P&L PERCENTILES (${cfg.simDays}-DAY)</div>
    <table class="data-table">
      <tr><th>Percentile</th><th style="text-align:right">P&L</th><th style="text-align:right">% of Account</th></tr>
      ${Object.entries(base.pnl.percentiles).map(([p, v]) => {
        const pctAcct = (v / cfg.accountSize * 100).toFixed(1);
        return `<tr>
          <td>${p}th</td>
          <td style="text-align:right" class="${v >= 0 ? 'pos' : 'neg'}">${fmt(v)}</td>
          <td style="text-align:right" class="${v >= 0 ? 'pos' : 'neg'}">${pctAcct}%</td>
        </tr>`;
      }).join('')}
    </table>
  </div>`;
  html += `</div>`;

  // ── Stress tests
  html += `<div class="section">
    <div class="section-title">STRESS TESTS</div>
    <div class="grid-3">`;

  // Win rate drop
  if (stress.winRateDrop10) {
    html += `<div class="section" style="margin-bottom:0">
      <div class="section-title" style="color:var(--red)">WIN RATE -10%</div>
      <table class="data-table">
        <tr><td>Median P&L</td><td style="text-align:right" class="${stress.winRateDrop10.pnl.median >= 0 ? 'pos' : 'neg'}">${fmt(stress.winRateDrop10.pnl.median)}</td></tr>
        <tr><td>P(Profit)</td><td style="text-align:right">${stress.winRateDrop10.probability.profit}%</td></tr>
        <tr><td>P(Ruin)</td><td style="text-align:right" class="${stress.winRateDrop10.probability.ruin > 5 ? 'neg' : ''}">${stress.winRateDrop10.probability.ruin}%</td></tr>
        <tr><td>5th %ile</td><td style="text-align:right" class="neg">${fmt(stress.winRateDrop10.pnl.percentiles[5])}</td></tr>
      </table>
    </div>`;
  }

  if (stress.winRateDrop20) {
    html += `<div class="section" style="margin-bottom:0">
      <div class="section-title" style="color:var(--red)">WIN RATE -20%</div>
      <table class="data-table">
        <tr><td>Median P&L</td><td style="text-align:right" class="${stress.winRateDrop20.pnl.median >= 0 ? 'pos' : 'neg'}">${fmt(stress.winRateDrop20.pnl.median)}</td></tr>
        <tr><td>P(Profit)</td><td style="text-align:right">${stress.winRateDrop20.probability.profit}%</td></tr>
        <tr><td>P(Ruin)</td><td style="text-align:right" class="${stress.winRateDrop20.probability.ruin > 5 ? 'neg' : ''}">${stress.winRateDrop20.probability.ruin}%</td></tr>
        <tr><td>5th %ile</td><td style="text-align:right" class="neg">${fmt(stress.winRateDrop20.pnl.percentiles[5])}</td></tr>
      </table>
    </div>`;
  }

  if (stress.widerSpreads) {
    html += `<div class="section" style="margin-bottom:0">
      <div class="section-title" style="color:var(--amber)">WIDER SPREADS (+$15)</div>
      <table class="data-table">
        <tr><td>Median P&L</td><td style="text-align:right" class="${stress.widerSpreads.pnl.median >= 0 ? 'pos' : 'neg'}">${fmt(stress.widerSpreads.pnl.median)}</td></tr>
        <tr><td>P(Profit)</td><td style="text-align:right">${stress.widerSpreads.probability.profit}%</td></tr>
        <tr><td>P(Ruin)</td><td style="text-align:right" class="${stress.widerSpreads.probability.ruin > 5 ? 'neg' : ''}">${stress.widerSpreads.probability.ruin}%</td></tr>
        <tr><td>5th %ile</td><td style="text-align:right" class="neg">${fmt(stress.widerSpreads.pnl.percentiles[5])}</td></tr>
      </table>
    </div>`;
  }

  html += `</div></div>`;

  // ── Cold streak analysis
  if (stress.coldStreak?.consecutiveLosses) {
    html += `<div class="grid-2">`;
    html += `<div class="section">
      <div class="section-title">COLD STREAK ANALYSIS</div>
      <table class="data-table">
        <tr><th>Worst N Trades</th><th style="text-align:right">P&L</th><th style="text-align:right">% of Account</th></tr>
        ${Object.entries(stress.coldStreak.consecutiveLosses).map(([n, d]) =>
          `<tr><td>${n} consecutive</td><td style="text-align:right" class="neg">${fmt(d.pnl)}</td><td style="text-align:right" class="neg">${d.pctOfAccount}%</td></tr>`
        ).join('')}
      </table>
    </div>`;

    // Worst/best days
    if (stress.worstDay) {
      html += `<div class="section">
        <div class="section-title">BEST & WORST DAYS</div>
        <table class="data-table">
          <tr><th>Date</th><th style="text-align:right">Trades</th><th style="text-align:right">Win%</th><th style="text-align:right">P&L</th></tr>
          ${(stress.worstDay.worst3 || []).map(d =>
            `<tr><td>${d.date}</td><td style="text-align:right">${d.count}</td><td style="text-align:right">${d.winRate}%</td><td style="text-align:right" class="neg">${fmt(d.pnl)} <span style="font-size:9px;color:var(--text3)">(${d.pctOfAccount}%)</span></td></tr>`
          ).join('')}
          <tr><td colspan="4" style="border-bottom:1px solid var(--border2)"></td></tr>
          ${(stress.worstDay.best3 || []).map(d =>
            `<tr><td>${d.date}</td><td style="text-align:right">${d.count}</td><td style="text-align:right">${d.winRate}%</td><td style="text-align:right" class="pos">${fmt(d.pnl)} <span style="font-size:9px;color:var(--text3)">(${d.pctOfAccount}%)</span></td></tr>`
          ).join('')}
        </table>
      </div>`;
    }
    html += `</div>`;
  }

  // ── Grade isolation
  if (stress.byGrade && Object.keys(stress.byGrade).length > 0) {
    html += `<div class="section">
      <div class="section-title">GRADE ISOLATION (EACH GRADE SIMULATED INDEPENDENTLY)</div>
      <table class="data-table">
        <tr><th>Grade</th><th style="text-align:right">Signals</th><th style="text-align:right">P(Profit)</th><th style="text-align:right">Median P&L</th><th style="text-align:right">5th %ile</th><th style="text-align:right">95th %ile</th><th style="text-align:right">Mean DD</th></tr>
        ${Object.entries(stress.byGrade).map(([g, d]) =>
          `<tr>
            <td style="font-weight:700">${g}</td>
            <td style="text-align:right">${mc.config.signalCount > 0 ? '—' : '—'}</td>
            <td style="text-align:right" class="${d.probability.profit >= 50 ? 'pos' : 'neg'}">${d.probability.profit}%</td>
            <td style="text-align:right" class="${d.pnl.median >= 0 ? 'pos' : 'neg'}">${fmt(d.pnl.median)}</td>
            <td style="text-align:right" class="neg">${fmt(d.pnl.percentiles[5])}</td>
            <td style="text-align:right" class="pos">${fmt(d.pnl.percentiles[95])}</td>
            <td style="text-align:right" class="neg">${fmt(d.drawdown.mean)}</td>
          </tr>`
        ).join('')}
      </table>
    </div>`;
  }

  // ── Daily P&L distribution
  html += `<div class="section">
    <div class="section-title">DAILY P&L STATISTICS</div>
    <div class="grid-3" style="margin-bottom:0">
      <div><div class="stat-label">MEAN</div><div class="stat-value ${base.daily.mean >= 0 ? 'pos' : 'neg'}" style="font-size:16px">${fmt(base.daily.mean)}</div></div>
      <div><div class="stat-label">MEDIAN</div><div class="stat-value ${base.daily.median >= 0 ? 'pos' : 'neg'}" style="font-size:16px">${fmt(base.daily.median)}</div></div>
      <div><div class="stat-label">STD DEV</div><div class="stat-value" style="font-size:16px;color:var(--text2)">${fmt(base.daily.stddev)}</div></div>
      <div><div class="stat-label">WORST 5%</div><div class="stat-value neg" style="font-size:16px">${fmt(base.daily.worst5)}</div></div>
      <div><div class="stat-label">BEST 95%</div><div class="stat-value pos" style="font-size:16px">${fmt(base.daily.best95)}</div></div>
      <div><div class="stat-label">AVG SIGNALS/DAY</div><div class="stat-value" style="font-size:16px;color:var(--amber)">${cfg.avgSignalsPerDay}</div></div>
    </div>
  </div>`;

  $('main').innerHTML = html;
}

// ── SVG Chart Renderers ─────────────────────────────────────────────────────

function renderGauge(value, color) {
  const w = Math.max(2, Math.min(100, value));
  return `<div class="gauge-bar">
    <div class="gauge-fill" style="width:${w}%;background:${color};opacity:0.6"></div>
    <div class="gauge-label">${value}%</div>
  </div>`;
}

function renderFanChart(paths, percentiles, days) {
  if (!paths || paths.length === 0) return '<div style="color:var(--text3);font-size:11px">No path data</div>';

  const W = 1100, H = 280, pad = { t: 20, r: 40, b: 30, l: 60 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;

  // Find bounds across all paths
  let yMin = 0, yMax = 0;
  for (const path of paths) {
    for (const v of path) {
      yMin = Math.min(yMin, v);
      yMax = Math.max(yMax, v);
    }
  }
  const yRange = Math.max(1, yMax - yMin);
  const xScale = pw / days;
  const yScale = ph / yRange;

  const x = i => pad.l + i * xScale;
  const y = v => pad.t + (yMax - v) * yScale;

  let svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;

  // Zero line
  svg += `<line x1="${pad.l}" y1="${y(0)}" x2="${W - pad.r}" y2="${y(0)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4,3"/>`;

  // Y-axis labels
  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const val = yMin + (yRange * i / yTicks);
    svg += `<text x="${pad.l - 8}" y="${y(val) + 3}" fill="var(--text4)" font-family="var(--mono)" font-size="9" text-anchor="end">${fmt(Math.round(val))}</text>`;
    svg += `<line x1="${pad.l}" y1="${y(val)}" x2="${W - pad.r}" y2="${y(val)}" stroke="var(--bg3)" stroke-width="0.5"/>`;
  }

  // X-axis labels
  for (let d = 0; d <= days; d += 5) {
    svg += `<text x="${x(d)}" y="${H - 8}" fill="var(--text4)" font-family="var(--mono)" font-size="9" text-anchor="middle">D${d}</text>`;
  }

  // Draw paths with low opacity
  for (const path of paths) {
    const points = path.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    const lastVal = path[path.length - 1];
    const color = lastVal >= 0 ? 'var(--green)' : 'var(--red)';
    svg += `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="0.8" opacity="0.15"/>`;
  }

  // Draw percentile bands: p5-p95 shaded
  if (percentiles) {
    // Median line (thicker)
    const medianPath = paths.length > 0 ? computeMedianPath(paths) : null;
    if (medianPath) {
      const pts = medianPath.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2" opacity="0.9"/>`;
    }
  }

  svg += '</svg>';
  return svg;
}

function computeMedianPath(paths) {
  const len = Math.max(...paths.map(p => p.length));
  const median = [];
  for (let i = 0; i < len; i++) {
    const vals = paths.map(p => p[i] || 0).sort((a, b) => a - b);
    median.push(vals[Math.floor(vals.length / 2)]);
  }
  return median;
}

function renderHistogram(bins) {
  if (!bins || bins.length === 0) return '';

  const W = 1100, H = 200, pad = { t: 10, r: 20, b: 30, l: 50 };
  const pw = W - pad.l - pad.r;
  const ph = H - pad.t - pad.b;

  const maxPct = Math.max(...bins.map(b => b.pct));
  const barW = pw / bins.length - 1;

  let svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;

  for (let i = 0; i < bins.length; i++) {
    const b = bins[i];
    const barH = (b.pct / maxPct) * ph;
    const bx = pad.l + i * (pw / bins.length);
    const by = pad.t + ph - barH;
    const isProfit = b.lo >= 0;
    const color = isProfit ? 'var(--green)' : 'var(--red)';

    svg += `<rect x="${bx}" y="${by}" width="${barW}" height="${barH}" fill="${color}" opacity="0.5" rx="1"/>`;

    // X labels (every 5th bin)
    if (i % 5 === 0 || i === bins.length - 1) {
      svg += `<text x="${bx + barW / 2}" y="${H - 8}" fill="var(--text4)" font-family="var(--mono)" font-size="8" text-anchor="middle">${fmt(b.lo)}</text>`;
    }
  }

  // Zero line
  const zeroBin = bins.findIndex(b => b.lo >= 0);
  if (zeroBin >= 0) {
    const zx = pad.l + zeroBin * (pw / bins.length);
    svg += `<line x1="${zx}" y1="${pad.t}" x2="${zx}" y2="${pad.t + ph}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3,2"/>`;
    svg += `<text x="${zx}" y="${pad.t - 2}" fill="var(--amber)" font-family="var(--mono)" font-size="8" text-anchor="middle">$0</text>`;
  }

  svg += '</svg>';
  return svg;
}

// ── Init ────────────────────────────────────────────────────────────────────
load();
