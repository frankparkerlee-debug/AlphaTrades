<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Control v3 — Strategy Validation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#060a0f;--bg1:#0b1118;--bg2:#111a24;--bg3:#182030;
  --border:#1e2d3d;--border2:#243547;
  --amber:#f59e0b;--amber2:#fbbf24;--green:#10b981;--green2:#34d399;
  --red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4;
  --text1:#e2e8f0;--text2:#a8b8c8;--text3:#6b7f94;--text4:#3d5068;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--text1);font-family:var(--sans);font-size:13px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg0)}::-webkit-scrollbar-thumb{background:var(--border2)}

#header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:44px;background:var(--bg1);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:3px;color:var(--amber)}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--purple)}
.nav-links{display:flex;gap:12px}
.nav-link{font-family:var(--mono);font-size:10px;color:var(--text3);text-decoration:none;letter-spacing:1px}
.nav-link:hover{color:var(--amber)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg1);padding:0 16px;overflow-x:auto}
.tab{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.5px;color:var(--text3);padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text1)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber)}

.container{max-width:1200px;margin:0 auto;padding:16px}
.tab-content{display:none}.tab-content.active{display:block}

/* Common */
.stat-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px 16px;min-width:100px;flex:1}
.stat-label{font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.stat-value{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--amber)}
.stat-sub{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px}
.section{background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:16px}
.section-title{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:12px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr}}
.data-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.data-table th{text-align:left;padding:6px 8px;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--text3);border-bottom:1px solid var(--border);text-transform:uppercase}
.data-table td{padding:5px 8px;border-bottom:1px solid var(--bg3);color:var(--text2)}
.data-table tr:hover td{background:var(--bg2)}
.pos{color:var(--green)}.neg{color:var(--red)}
.gauge-bar{height:24px;background:var(--bg3);border-radius:4px;overflow:hidden;position:relative;margin:4px 0}
.gauge-fill{height:100%;border-radius:4px 0 0 4px}
.gauge-label{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text1)}
.chart-svg{width:100%}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.5px}
.badge-green{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)}
.verdict{font-family:var(--mono);font-size:14px;font-weight:700;padding:12px 16px;border-radius:5px;margin-bottom:16px}
.verdict-robust{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.verdict-moderate{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--amber)}
.verdict-fragile{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-text{font-family:var(--mono);font-size:12px;letter-spacing:1px;margin-bottom:8px}

/* Strategy Cards */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;margin-bottom:16px}
.sc-card{background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:16px;position:relative;overflow:hidden}
.sc-card.sc-deploy{border-left:3px solid var(--green)}
.sc-card.sc-refine{border-left:3px solid var(--amber)}
.sc-card.sc-shelve{border-left:3px solid var(--red)}
.sc-card.sc-insufficient{border-left:3px solid var(--text4)}
.sc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.sc-name{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text1);letter-spacing:.5px}
.sc-verdict-badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 10px;border-radius:3px;letter-spacing:1px}
.sc-verdict-deploy{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.sc-verdict-refine{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.sc-verdict-shelve{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.sc-verdict-insufficient{background:var(--bg3);color:var(--text4);border:1px solid var(--border)}
.sc-phases{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.sc-phase{background:var(--bg3);border-radius:4px;padding:8px;text-align:center}
.sc-phase-score{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--text1)}
.sc-phase-label{font-size:7px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.sc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.sc-metric{background:var(--bg2);border-radius:3px;padding:5px 6px;text-align:center}
.sc-metric-val{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text1)}
.sc-metric-label{font-size:7px;letter-spacing:.5px;color:var(--text3);text-transform:uppercase;margin-top:1px}
.sc-flags{margin-top:8px}
.sc-flag{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:2px;display:inline-block;margin:1px 2px}
.sc-flag-good{background:rgba(16,185,129,.1);color:var(--green)}
.sc-flag-bad{background:rgba(239,68,68,.1);color:var(--red)}
.sc-score-bar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sc-score-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.sc-score-fill{height:100%;border-radius:3px}
.sc-score-text{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--text2);min-width:28px;text-align:right}
.sc-summary-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.sc-summary-stat{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px 16px;min-width:120px;flex:1}
</style>
</head>
<body>

<div id="header">
  <div class="logo"><div class="logo-dot"></div>LAUNCH CONTROL — VALIDATION</div>
  <div class="nav-links">
    <a href="/backtest" class="nav-link">BACKTEST</a>
    <a href="/multi-strategy" class="nav-link">MULTI-STRATEGY</a>
    <a href="/auto-trader" class="nav-link">AUTO-TRADER</a>
    <a href="/" class="nav-link">DASHBOARD</a>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="strategy-cards">PER-STRATEGY VALIDATION</div>
  <div class="tab" data-tab="overview">AGGREGATE OVERVIEW</div>
  <div class="tab" data-tab="monte-carlo">AGGREGATE MC</div>
  <div class="tab" data-tab="walk-forward">AGGREGATE WALK-FWD</div>
  <div class="tab" data-tab="regime">AGGREGATE REGIME</div>
  <div class="tab" data-tab="sensitivity">AGGREGATE SENSITIVITY</div>
  <div class="tab" data-tab="paper">PAPER P&L</div>
</div>

<div class="container">
  <div class="tab-content active" id="tc-strategy-cards"><div class="empty"><div class="empty-text">LOADING...</div></div></div>
  <div class="tab-content" id="tc-overview"><div class="empty"><div class="empty-text">LOADING...</div></div></div>
  <div class="tab-content" id="tc-monte-carlo"></div>
  <div class="tab-content" id="tc-walk-forward"></div>
  <div class="tab-content" id="tc-regime"></div>
  <div class="tab-content" id="tc-sensitivity"></div>
  <div class="tab-content" id="tc-paper"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n>=0?`+$${Math.abs(n).toLocaleString()}`:`-$${Math.abs(n).toLocaleString()}`;

// Tab switching
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('tc-'+t.dataset.tab).classList.add('active');
  };
});

// Handle URL hash
if(location.hash){
  const tab=location.hash.slice(1);
  const el=document.querySelector(`[data-tab="${tab}"]`);
  if(el)el.click();
}

async function load(){
  const [vRes,pRes]=await Promise.all([
    fetch('/api/backtest/validation').then(r=>r.json()).catch(()=>null),
    fetch('/api/paper/summary').then(r=>r.json()).catch(()=>null),
  ]);
  if(!vRes||!vRes.summary){
    $('tc-overview').innerHTML='<div class="empty"><div class="empty-text">NO VALIDATION DATA</div><div style="margin-top:8px;font-size:11px;color:var(--text3)">Run a backtest first from <a href="/backtest" style="color:var(--amber)">/backtest</a></div></div>';
    return;
  }
  renderOverview(vRes);
  renderMonteCarlo(vRes);
  renderWalkForward(vRes);
  renderRegime(vRes);
  renderSensitivity(vRes);
  renderPaper(pRes);
}

// ── OVERVIEW TAB ────────────────────────────────────────────────────────────
function renderOverview(d){
  const s=d.summary;const mc=d.monteCarlo;const wf=d.walkForward;const rs=d.regimeStress;const sens=d.sensitivity;
  let h='';

  // Verdicts row
  h+=`<div class="stat-row">`;
  if(wf?.summary?.verdict)h+=verdictCard('WALK-FORWARD',wf.summary.verdict,wf.summary.verdictDetail);
  if(rs?.verdict)h+=verdictCard('REGIME STRESS',rs.verdict,rs.verdictDetail);
  if(sens?.robustness?.verdict)h+=verdictCard('PARAM SENSITIVITY',sens.robustness.verdict,sens.robustness.verdictDetail);
  h+=`</div>`;

  // Key stats
  h+=`<div class="stat-row">
    <div class="stat"><div class="stat-label">SIGNALS</div><div class="stat-value">${s.totalSignals}</div><div class="stat-sub">${s.signalsPerDay}/day</div></div>
    <div class="stat"><div class="stat-label">WIN RATE</div><div class="stat-value">${s.winRate}%</div></div>
    <div class="stat"><div class="stat-label">TOTAL P&L</div><div class="stat-value ${s.totalPnlDollars>=0?'pos':'neg'}" style="color:${s.totalPnlDollars>=0?'var(--green)':'var(--red)'}">${fmt(s.totalPnlDollars)}</div></div>
    <div class="stat"><div class="stat-label">PROFIT FACTOR</div><div class="stat-value">${s.profitFactor}</div></div>
    <div class="stat"><div class="stat-label">MAX DRAWDOWN</div><div class="stat-value neg" style="font-size:16px">${fmt(s.maxDrawdownDollars)}</div></div>
  </div>`;

  if(mc?.base){
    h+=`<div class="stat-row">
      <div class="stat"><div class="stat-label">P(PROFIT) MC</div><div class="stat-value ${mc.base.probability.profit>=50?'pos':'neg'}" style="color:${mc.base.probability.profit>=50?'var(--green)':'var(--red)'}">${mc.base.probability.profit}%</div></div>
      <div class="stat"><div class="stat-label">MC MEDIAN P&L</div><div class="stat-value ${mc.base.pnl.median>=0?'pos':'neg'}" style="color:${mc.base.pnl.median>=0?'var(--green)':'var(--red)'}">${fmt(mc.base.pnl.median)}</div></div>
      <div class="stat"><div class="stat-label">SHARPE</div><div class="stat-value" style="color:var(--cyan)">${mc.tradeStats?.sharpe||'--'}</div></div>
      <div class="stat"><div class="stat-label">KELLY</div><div class="stat-value" style="color:var(--cyan)">${mc.tradeStats?.kellyPct||'--'}%</div></div>
      <div class="stat"><div class="stat-label">OOS CONSISTENCY</div><div class="stat-value">${wf?.summary?.consistency||'--'}%</div></div>
    </div>`;
  }

  // Equity curve
  if(d.equityCurve?.length>0){
    h+=`<div class="section"><div class="section-title">EQUITY CURVE</div>${renderEquityCurve(d.equityCurve)}</div>`;
  }

  h+=`<div style="font-family:var(--mono);font-size:9px;color:var(--text4);margin-top:8px">Last run: ${d.lastRun?new Date(d.lastRun).toLocaleString():'unknown'} | ${d.config?.tradingDays||'?'} trading days | $${(d.config?.accountSize||0).toLocaleString()} account</div>`;
  $('tc-overview').innerHTML=h;
}

function verdictCard(title,verdict,detail){
  const cls=verdict==='ROBUST'||verdict==='ALL-WEATHER'?'verdict-robust':verdict==='MODERATE'||verdict==='CONDITIONAL'?'verdict-moderate':'verdict-fragile';
  return`<div class="stat" style="flex:1"><div class="stat-label">${title}</div><div class="verdict ${cls}" style="margin-top:4px;font-size:12px;padding:8px">${verdict}<div style="font-size:9px;font-weight:400;margin-top:4px;color:var(--text2)">${detail}</div></div></div>`;
}

// ── MONTE CARLO TAB ─────────────────────────────────────────────────────────
function renderMonteCarlo(d){
  const mc=d.monteCarlo;if(!mc?.base){$('tc-monte-carlo').innerHTML=noData();return}
  const b=mc.base;const st=mc.stress;const ts=mc.tradeStats;const cfg=mc.config;
  let h=`<div style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px;margin-bottom:12px">${cfg.iterations.toLocaleString()} SIMULATIONS | ${cfg.simDays} DAYS | ${cfg.signalCount} TRADES</div>`;

  h+=`<div class="stat-row">
    <div class="stat"><div class="stat-label">P(PROFIT)</div><div class="stat-value ${b.probability.profit>=50?'pos':'neg'}" style="color:${b.probability.profit>=50?'var(--green)':'var(--red)'}">${b.probability.profit}%</div></div>
    <div class="stat"><div class="stat-label">MEDIAN P&L</div><div class="stat-value ${b.pnl.median>=0?'pos':'neg'}" style="color:${b.pnl.median>=0?'var(--green)':'var(--red)'}">${fmt(b.pnl.median)}</div></div>
    <div class="stat"><div class="stat-label">5TH %ILE</div><div class="stat-value neg" style="color:var(--red)">${fmt(b.pnl.percentiles[5])}</div></div>
    <div class="stat"><div class="stat-label">95TH %ILE</div><div class="stat-value pos" style="color:var(--green)">${fmt(b.pnl.percentiles[95])}</div></div>
    <div class="stat"><div class="stat-label">P(RUIN)</div><div class="stat-value ${b.probability.ruin<5?'':'neg'}" style="color:${b.probability.ruin<5?'var(--green)':'var(--red)'}">${b.probability.ruin}%</div></div>
  </div>`;

  // Fan chart
  if(b.paths?.length>0)h+=`<div class="section"><div class="section-title">SIMULATION PATHS</div>${renderFanChart(b.paths,cfg.simDays)}</div>`;

  // Histogram
  if(b.histogram)h+=`<div class="section"><div class="section-title">P&L DISTRIBUTION</div>${renderHistogram(b.histogram)}</div>`;

  // Risk metrics + percentiles
  h+=`<div class="grid-2">`;
  h+=`<div class="section"><div class="section-title">RISK METRICS</div><table class="data-table">
    <tr><td>Sharpe</td><td style="text-align:right" class="${ts.sharpe>0?'pos':'neg'}">${ts.sharpe}</td></tr>
    <tr><td>Sortino</td><td style="text-align:right" class="${ts.sortino>0?'pos':'neg'}">${ts.sortino}</td></tr>
    <tr><td>Profit Factor</td><td style="text-align:right">${ts.profitFactor}</td></tr>
    <tr><td>Expectancy</td><td style="text-align:right" class="${ts.expectancy>=0?'pos':'neg'}">${fmt(ts.expectancy)}</td></tr>
    <tr><td>Kelly %</td><td style="text-align:right">${ts.kellyPct}%</td></tr>
    <tr><td>Win Rate</td><td style="text-align:right">${ts.winRate}%</td></tr>
    <tr><td>Avg Win</td><td style="text-align:right" class="pos">${fmt(ts.avgWin)}</td></tr>
    <tr><td>Avg Loss</td><td style="text-align:right" class="neg">${fmt(ts.avgLoss)}</td></tr>
    <tr><td>Mean Max DD</td><td style="text-align:right" class="neg">${fmt(b.drawdown.mean)}</td></tr>
  </table></div>`;

  h+=`<div class="section"><div class="section-title">P&L PERCENTILES</div><table class="data-table">
    <tr><th>%ile</th><th style="text-align:right">P&L</th><th style="text-align:right">% Acct</th></tr>
    ${Object.entries(b.pnl.percentiles).map(([p,v])=>`<tr><td>${p}th</td><td style="text-align:right" class="${v>=0?'pos':'neg'}">${fmt(v)}</td><td style="text-align:right" class="${v>=0?'pos':'neg'}">${(v/cfg.accountSize*100).toFixed(1)}%</td></tr>`).join('')}
  </table></div>`;
  h+=`</div>`;

  // Stress tests
  if(st){
    h+=`<div class="section"><div class="section-title">STRESS TESTS</div><div class="grid-3">`;
    if(st.winRateDrop10)h+=stressCard('WIN RATE -10%',st.winRateDrop10);
    if(st.winRateDrop20)h+=stressCard('WIN RATE -20%',st.winRateDrop20);
    if(st.widerSpreads)h+=stressCard('WIDER SPREADS',st.widerSpreads);
    h+=`</div></div>`;
  }

  $('tc-monte-carlo').innerHTML=h;
}

function stressCard(title,d){
  return`<div class="section" style="margin:0"><div class="section-title" style="color:var(--red)">${title}</div><table class="data-table">
    <tr><td>Median</td><td style="text-align:right" class="${d.pnl.median>=0?'pos':'neg'}">${fmt(d.pnl.median)}</td></tr>
    <tr><td>P(Profit)</td><td style="text-align:right">${d.probability.profit}%</td></tr>
    <tr><td>P(Ruin)</td><td style="text-align:right" class="${d.probability.ruin>5?'neg':''}">${d.probability.ruin}%</td></tr>
  </table></div>`;
}

// ── WALK-FORWARD TAB ────────────────────────────────────────────────────────
function renderWalkForward(d){
  const wf=d.walkForward;if(!wf||wf.error){$('tc-walk-forward').innerHTML=noData(wf?.error);return}
  const s=wf.summary;
  let h='';

  const cls=s.verdict==='ROBUST'?'verdict-robust':s.verdict==='MODERATE'?'verdict-moderate':'verdict-fragile';
  h+=`<div class="verdict ${cls}">${s.verdict}: ${s.verdictDetail}</div>`;

  h+=`<div class="stat-row">
    <div class="stat"><div class="stat-label">TRAIN WIN RATE</div><div class="stat-value">${s.avgTrainWinRate}%</div><div class="stat-sub">in-sample avg</div></div>
    <div class="stat"><div class="stat-label">TEST WIN RATE</div><div class="stat-value ${s.avgTestWinRate>=s.avgTrainWinRate*.85?'pos':'neg'}" style="color:${s.avgTestWinRate>=s.avgTrainWinRate*.85?'var(--green)':'var(--red)'}">${s.avgTestWinRate}%</div><div class="stat-sub">out-of-sample avg</div></div>
    <div class="stat"><div class="stat-label">WR DEGRADATION</div><div class="stat-value ${s.winRateDegradation>=.85?'':'neg'}" style="color:${s.winRateDegradation>=.85?'var(--green)':s.winRateDegradation>=.7?'var(--amber)':'var(--red)'}">${s.winRateDegradation}x</div><div class="stat-sub">1.0 = no loss</div></div>
    <div class="stat"><div class="stat-label">CONSISTENCY</div><div class="stat-value">${s.consistency}%</div><div class="stat-sub">${s.profitableWindows}/${s.totalWindows} profitable</div></div>
    <div class="stat"><div class="stat-label">TRAIN AVG P&L</div><div class="stat-value ${s.avgTrainPnl>=0?'pos':'neg'}" style="color:${s.avgTrainPnl>=0?'var(--green)':'var(--red)'}; font-size:14px">${fmt(s.avgTrainPnl)}</div></div>

// ── SVG RENDERERS ───────────────────────────────────────────────────────────
function renderEquityCurve(curve){
  const W=1100,H=200,pad={t:15,r:30,b:25,l:55};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const vals=curve.map(c=>c.cumPnl);
  let yMin=Math.min(0,...vals),yMax=Math.max(0,...vals);
  const yR=Math.max(1,yMax-yMin);
  const x=i=>pad.l+i/(curve.length-1)*pw;
  const y=v=>pad.t+(yMax-v)/yR*ph;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  svg+=`<line x1="${pad.l}" y1="${y(0)}" x2="${W-pad.r}" y2="${y(0)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4,3"/>`;
  const pts=curve.map((c,i)=>`${x(i)},${y(c.cumPnl)}`).join(' ');
  const last=vals[vals.length-1];
  svg+=`<polyline points="${pts}" fill="none" stroke="${last>=0?'var(--green)':'var(--red)'}" stroke-width="2"/>`;
  svg+=`</svg>`;return svg;
}

function renderFanChart(paths,days){
  const W=1100,H=250,pad={t:15,r:30,b:25,l:55};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  let yMin=0,yMax=0;
  for(const p of paths)for(const v of p){yMin=Math.min(yMin,v);yMax=Math.max(yMax,v)}
  const yR=Math.max(1,yMax-yMin);
  const x=i=>pad.l+i/days*pw;
  const y=v=>pad.t+(yMax-v)/yR*ph;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  svg+=`<line x1="${pad.l}" y1="${y(0)}" x2="${W-pad.r}" y2="${y(0)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4,3"/>`;
  for(const p of paths){
    const pts=p.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const c=p[p.length-1]>=0?'var(--green)':'var(--red)';
    svg+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width=".8" opacity=".15"/>`;
  }
  const med=computeMedianPath(paths);
  if(med){const pts=med.map((v,i)=>`${x(i)},${y(v)}`).join(' ');svg+=`<polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2" opacity=".9"/>`}
  svg+=`</svg>`;return svg;
}

function computeMedianPath(paths){
  const len=Math.max(...paths.map(p=>p.length));
  const m=[];
  for(let i=0;i<len;i++){const v=paths.map(p=>p[i]||0).sort((a,b)=>a-b);m.push(v[Math.floor(v.length/2)])}
  return m;
}

function renderHistogram(bins){
  const W=1100,H=180,pad={t:10,r:20,b:25,l:40};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const maxP=Math.max(...bins.map(b=>b.pct));
  const bw=pw/bins.length-1;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<bins.length;i++){
    const b=bins[i],bh=b.pct/maxP*ph,bx=pad.l+i*(pw/bins.length),by=pad.t+ph-bh;
    svg+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${b.lo>=0?'var(--green)':'var(--red)'}" opacity=".5" rx="1"/>`;
    if(i%5===0)svg+=`<text x="${bx+bw/2}" y="${H-6}" fill="var(--text4)" font-family="var(--mono)" font-size="8" text-anchor="middle">${fmt(b.lo)}</text>`;
  }
  const zi=bins.findIndex(b=>b.lo>=0);
  if(zi>=0){const zx=pad.l+zi*(pw/bins.length);svg+=`<line x1="${zx}" y1="${pad.t}" x2="${zx}" y2="${pad.t+ph}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3,2"/>`}
  svg+=`</svg>`;return svg;
}

function renderOOSCurve(curve){
  const W=1100,H=160,pad={t:15,r:30,b:25,l:55};
  const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
  const vals=curve.map(c=>c.cumPnl);
  let yMin=Math.min(0,...vals),yMax=Math.max(0,...vals);
  const yR=Math.max(1,yMax-yMin);
  const x=i=>pad.l+i/(curve.length-1)*pw;
  const y=v=>pad.t+(yMax-v)/yR*ph;
  let svg=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}">`;
  svg+=`<line x1="${pad.l}" y1="${y(0)}" x2="${W-pad.r}" y2="${y(0)}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="4,3"/>`;
  for(let i=0;i<curve.length;i++){
    const c=curve[i];
    svg+=`<rect x="${x(i)-8}" y="${c.pnl>=0?y(c.cumPnl):y(0)}" width="16" height="${Math.abs(y(c.cumPnl)-y(c.cumPnl-c.pnl))}" fill="${c.pnl>=0?'var(--green)':'var(--red)'}" opacity=".5" rx="2"/>`;
  }
  const pts=curve.map((c,i)=>`${x(i)},${y(c.cumPnl)}`).join(' ');
  svg+=`<polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2"/>`;
  for(let i=0;i<curve.length;i++){svg+=`<circle cx="${x(i)}" cy="${y(curve[i].cumPnl)}" r="3" fill="var(--amber)"/>`}
  svg+=`</svg>`;return svg;
}

function noData(msg){return`<div class="empty"><div class="empty-text">${msg||'NO DATA'}</div><div style="font-size:11px;color:var(--text3);margin-top:8px">Run a backtest from <a href="/backtest" style="color:var(--amber)">/backtest</a> to generate validation data.</div></div>`}

// ── STRATEGY CARDS TAB ───────────────────────────────────────────────────────
async function loadStrategyCards(){
  try{
    const res=await fetch('/api/backtest/strategy-cards').then(r=>r.json());
    if(!res||(!res.strategyReportCards&&!res.strategyValidation)){
      $('tc-strategy-cards').innerHTML=noData('No per-strategy validation data');return;
    }
    renderStrategyCards(res);
  }catch{
    $('tc-strategy-cards').innerHTML=noData('Failed to load strategy cards');
  }
}

function renderStrategyCards(d){
  const rc=d.strategyReportCards||{};
  const sv=d.strategyValidation||{};
  const gc=d.gradeCalibrations||{};
  const bs=d.byStrategy||{};
  const strategies=Object.keys({...rc,...sv}).sort();

  if(strategies.length===0){$('tc-strategy-cards').innerHTML=noData('No strategies found');return}

  // Summary counters
  let deploy=0,refine=0,shelve=0,insuf=0;
  strategies.forEach(s=>{
    const v=rc[s]?.verdict?.decision||sv[s]?.verdict||'';
    if(v==='DEPLOY')deploy++;else if(v==='REFINE')refine++;else if(v==='SHELVE')shelve++;else insuf++;
  });

  // Check if all strategies share identical validation (tested as one)
  const allVals=strategies.map(s=>sv[s]).filter(Boolean);
  const hasTruePerStrategy=allVals.length>1&&new Set(allVals.map(v=>v.signalCount)).size>1;

  let h=`<div class="section" style="margin-bottom:16px;border-left:3px solid var(--amber)">
    <div style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--amber);letter-spacing:1px;margin-bottom:6px">INDEPENDENT PER-STRATEGY VALIDATION</div>
    <div style="font-size:11px;color:var(--text2);line-height:1.6">
      Each strategy below was tested <strong style="color:var(--text1)">independently</strong> through the full validation pipeline:
      Monte Carlo simulation, walk-forward analysis, regime stress testing, out-of-sample split, and statistical significance (t-test).
      <strong style="color:var(--green)">DEPLOY</strong> = passed all gates.
      <strong style="color:var(--amber)">REFINE</strong> = shows edge but needs tuning.
      <strong style="color:var(--red)">SHELVE</strong> = no proven edge, disabled.
      Strategies cannot hide behind aggregate results -- each must stand on its own.
    </div>
  </div>`;

  if(!hasTruePerStrategy&&allVals.length>1){
    h+=`<div class="verdict verdict-fragile" style="margin-bottom:16px">
      DATA MAY BE STALE -- Run a fresh backtest from <a href="/backtest" style="color:var(--amber)">/backtest</a> to generate per-strategy validation with the new 16-strategy engine.
    </div>`;
  }

  h+=`<div class="sc-summary-row">
    <div class="sc-summary-stat"><div class="stat-label">TOTAL STRATEGIES</div><div class="stat-value">${strategies.length}</div></div>
    <div class="sc-summary-stat"><div class="stat-label">DEPLOY</div><div class="stat-value" style="color:var(--green)">${deploy}</div></div>
    <div class="sc-summary-stat"><div class="stat-label">REFINE</div><div class="stat-value" style="color:var(--amber)">${refine}</div></div>
    <div class="sc-summary-stat"><div class="stat-label">SHELVE</div><div class="stat-value" style="color:var(--red)">${shelve}</div></div>
    <div class="sc-summary-stat"><div class="stat-label">INSUFFICIENT DATA</div><div class="stat-value" style="color:var(--text3)">${insuf}</div></div>
  </div>`;

  h+=`<div class="sc-grid">`;
  // Sort: DEPLOY first, then REFINE, SHELVE, INSUFFICIENT
  const order={'DEPLOY':0,'REFINE':1,'SHELVE':2};
  strategies.sort((a,b)=>{
    const va=rc[a]?.verdict?.decision||sv[a]?.verdict||'INSUFFICIENT_DATA';
    const vb=rc[b]?.verdict?.decision||sv[b]?.verdict||'INSUFFICIENT_DATA';
    return(order[va]??3)-(order[vb]??3);
  });

  const STRAT_TYPE={
    ORB_BREAKOUT:'DAY',VWAP_BOUNCE:'DAY',FIRST_PULLBACK:'DAY',GAP_FILL_REVERSION:'DAY',
    POWER_HOUR_MOMENTUM:'DAY',MACRO_REACTION:'DAY',EXTREME_REVERSAL:'DAY',
    EOD_MEAN_REVERSION:'DAY',HIGH_RVOL_BREAKOUT:'DAY',
    PEAD_DRIFT:'SWING',SECTOR_LAGGARD:'SWING',SHORT_SQUEEZE_MOMENTUM:'SWING',
    OPTIONS_FLOW:'SWING',ANALYST_DRIFT:'SWING',VIX_REVERSAL:'SWING',
    ZERO_DTE_SCALP:'SCALP'
  };
  const TYPE_COLOR={DAY:'var(--blue)',SWING:'var(--purple)',SCALP:'var(--amber)'};

  for(const strat of strategies){
    const card=rc[strat]||{};
    const val=sv[strat]||{};
    const cal=gc[strat]||{};
    const verdict=card.verdict?.decision||val.verdict||'INSUFFICIENT_DATA';
    const cls=verdict==='DEPLOY'?'sc-deploy':verdict==='REFINE'?'sc-refine':verdict==='SHELVE'?'sc-shelve':'sc-insufficient';
    const vBadge=verdict==='DEPLOY'?'sc-verdict-deploy':verdict==='REFINE'?'sc-verdict-refine':verdict==='SHELVE'?'sc-verdict-shelve':'sc-verdict-insufficient';
    const sType=STRAT_TYPE[strat]||'';
    const sColor=TYPE_COLOR[sType]||'var(--text3)';

    h+=`<div class="sc-card ${cls}">`;
    // Header
    h+=`<div class="sc-header">
      <div>
        <div class="sc-name">${strat.replace(/_/g,' ')}${sType?` <span style="font-size:9px;color:${sColor};border:1px solid ${sColor};padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:middle">${sType}</span>`:''}</div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px">${card.signalCount||val.signalCount||0} signals tested independently</div>
      </div>
      <div class="sc-verdict-badge ${vBadge}">${verdict.replace('_',' ')}</div>
    </div>`;

    // Three-phase scores
    if(card.phases){
      const p=card.phases;
      h+=`<div class="sc-phases">
        <div class="sc-phase">
          <div class="sc-phase-score" style="color:${phaseColor(p.setup?.avgScore)}">${p.setup?.avgScore!=null?Math.round(p.setup.avgScore):'--'}</div>
          <div class="sc-phase-label">SETUP</div>
        </div>
        <div class="sc-phase">
          <div class="sc-phase-score" style="color:${phaseColor(p.direction?.avgScore)}">${p.direction?.avgScore!=null?Math.round(p.direction.avgScore):'--'}</div>
          <div class="sc-phase-label">DIRECTION</div>
        </div>
        <div class="sc-phase">
          <div class="sc-phase-score" style="color:${phaseColor(p.exit?.avgScore)}">${p.exit?.avgScore!=null?Math.round(p.exit.avgScore):'--'}</div>
          <div class="sc-phase-label">EXIT</div>
        </div>
      </div>`;
    }

    // Net score bar
    if(card.verdict?.netScore!=null){
      const ns=card.verdict.netScore;
      const pct=Math.max(0,Math.min(100,(ns+10)/20*100));
      const barColor=ns>=3?'var(--green)':ns>=0?'var(--amber)':'var(--red)';
      h+=`<div class="sc-score-bar">
        <div style="font-size:7px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;min-width:50px">NET SCORE</div>
        <div class="sc-score-track"><div class="sc-score-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="sc-score-text" style="color:${barColor}">${ns>=0?'+':''}${ns}</div>
      </div>`;
    }

    // Key metrics grid
    const summary=val.summary||card.validation||{};
    const mcProfit=val.monteCarlo?.base?.probability?.profit??card.validation?.monteCarlo??null;
    const wfVerdict=val.walkForward?.verdict??card.validation?.walkForward??null;
    const oos=val.outOfSample?.verdict??card.validation?.outOfSample??null;
    const pVal=val.statisticalTests?.tTest?.pValue??card.validation?.statisticalTests?.pValue??null;

    h+=`<div class="sc-metrics">
      <div class="sc-metric"><div class="sc-metric-val" style="color:${(summary.winRate||0)>=50?'var(--green)':'var(--red)'}">${summary.winRate!=null?summary.winRate+'%':'--'}</div><div class="sc-metric-label">WIN RATE</div></div>
      <div class="sc-metric"><div class="sc-metric-val" style="color:${(summary.profitFactor||0)>=1?'var(--green)':'var(--red)'}">${summary.profitFactor!=null?summary.profitFactor:'--'}</div><div class="sc-metric-label">PROFIT FACTOR</div></div>
      <div class="sc-metric"><div class="sc-metric-val" style="color:${mcProfit!=null&&mcProfit>=50?'var(--green)':mcProfit!=null?'var(--red)':'var(--text3)'}">${mcProfit!=null?mcProfit+'%':'--'}</div><div class="sc-metric-label">MC P(PROFIT)</div></div>
      <div class="sc-metric"><div class="sc-metric-val" style="color:${wfVerdict==='ROBUST'?'var(--green)':wfVerdict==='OVERFIT'?'var(--red)':'var(--text3)'}">${wfVerdict||'--'}</div><div class="sc-metric-label">WALK-FWD</div></div>
    </div>`;

    // Second metrics row
    h+=`<div class="sc-metrics">
      <div class="sc-metric"><div class="sc-metric-val ${(summary.totalPnlDollars||0)>=0?'pos':'neg'}" style="color:${(summary.totalPnlDollars||0)>=0?'var(--green)':'var(--red)'}">${summary.totalPnlDollars!=null?fmt(summary.totalPnlDollars):'--'}</div><div class="sc-metric-label">TOTAL P&L</div></div>
      <div class="sc-metric"><div class="sc-metric-val" style="color:${oos==='ROBUST'||oos==='PASS'?'var(--green)':oos==='OVERFIT'||oos==='FAIL'?'var(--red)':'var(--text3)'}">${oos||'--'}</div><div class="sc-metric-label">OOS TEST</div></div>
      <div class="sc-metric"><div class="sc-metric-val" style="color:${pVal!=null&&pVal<0.05?'var(--green)':pVal!=null?'var(--red)':'var(--text3)'}">${pVal!=null?'p='+pVal.toFixed(3):'--'}</div><div class="sc-metric-label">STAT SIG</div></div>
      <div class="sc-metric"><div class="sc-metric-val">${cal.calibrationQuality||'--'}</div><div class="sc-metric-label">CALIBRATION</div></div>
    </div>`;

    // Direction accuracy (if available)
    if(card.phases?.direction?.dirCorrectPct!=null){
      const dir=card.phases.direction.dirCorrectPct;
      h+=`<div class="sc-score-bar">
        <div style="font-size:7px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;min-width:50px">DIR ACC</div>
        <div class="sc-score-track"><div class="sc-score-fill" style="width:${dir}%;background:${dir>=50?'var(--green)':'var(--red)'}"></div></div>
        <div class="sc-score-text" style="color:${dir>=50?'var(--green)':'var(--red)'}">${dir.toFixed(0)}%</div>
      </div>`;
    }

    // Exit efficiency (if available)
    if(card.phases?.exit?.avgEfficiency!=null){
      const eff=card.phases.exit.avgEfficiency*100;
      h+=`<div class="sc-score-bar">
        <div style="font-size:7px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;min-width:50px">EXIT EFF</div>
        <div class="sc-score-track"><div class="sc-score-fill" style="width:${eff}%;background:${eff>=40?'var(--green)':eff>=25?'var(--amber)':'var(--red)'}"></div></div>
        <div class="sc-score-text">${eff.toFixed(0)}%</div>
      </div>`;
    }

    // Strengths & weaknesses
    if(card.verdict?.strengths?.length>0||card.verdict?.weaknesses?.length>0){
      h+=`<div class="sc-flags">`;
      (card.verdict.strengths||[]).forEach(s=>h+=`<span class="sc-flag sc-flag-good">+ ${s}</span>`);
      (card.verdict.weaknesses||[]).forEach(w=>h+=`<span class="sc-flag sc-flag-bad">- ${w}</span>`);
      h+=`</div>`;
    }

    // Validation flags from strategyValidation
    if(val.flags?.length>0&&!card.verdict?.weaknesses?.length){
      h+=`<div class="sc-flags">`;
      val.flags.forEach(f=>h+=`<span class="sc-flag sc-flag-bad">${f}</span>`);
      h+=`</div>`;
    }

    h+=`</div>`;
  }
  h+=`</div>`;

  h+=`<div style="font-family:var(--mono);font-size:9px;color:var(--text4);margin-top:8px">Last run: ${d.lastRun?new Date(d.lastRun).toLocaleString():'unknown'}</div>`;
  $('tc-strategy-cards').innerHTML=h;
}

function phaseColor(score){
  if(score==null)return'var(--text3)';
  if(score>=70)return'var(--green)';
  if(score>=50)return'var(--amber)';
  return'var(--red)';
}

load();
loadStrategyCards();
</script>
</body>
</html>
