<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AlphaTrades{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0e27;
            color: #e0e6ed;
            min-height: 100vh;
        }
        
        /* Top Navigation - Consistent across all pages */
        .top-nav {
            background: #0f1629;
            border-bottom: 1px solid #1a1f3a;
            padding: 0 24px;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .logo-accent { color: #3b82f6; }
        
        .nav-links {
            display: flex;
            gap: 4px;
            height: 100%;
            align-items: center;
        }
        
        .nav-link {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s;
            border-radius: 6px;
        }
        .nav-link:hover {
            background: #1e293b;
            color: #fff;
        }
        .nav-link.active {
            background: #3b82f6;
            color: #fff;
        }
        
        .nav-stats {
            display: flex;
            gap: 24px;
            font-size: 13px;
        }
        .nav-stat-label {
            color: #64748b;
            margin-right: 6px;
            font-weight: 500;
        }
        .nav-stat-value {
            color: #e0e6ed;
            font-weight: 600;
        }
        .nav-stat-value.positive { color: #22c55e; }
        .nav-stat-value.negative { color: #ef4444; }
        
        /* Main Content Area */
        .main-content {
            padding: 24px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* Page Header */
        .page-header {
            margin-bottom: 24px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .page-subtitle {
            color: #64748b;
            font-size: 14px;
        }
        
        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        
        /* Signal Card - Unified design */
        .signal-card {
            background: #0f1629;
            border: 1px solid #1a1f3a;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.15s;
        }
        .signal-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
        }
        .signal-card.alert {
            border-color: #ef4444;
            background: linear-gradient(135deg, #0f1629 0%, #1a0a0a 100%);
        }
        .signal-card.opportunity {
            border-color: #22c55e;
            background: linear-gradient(135deg, #0f1629 0%, #0a1a0a 100%);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .ticker-symbol {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .ticker-price {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 2px;
        }
        
        .score-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
        }
        .score-badge.high { background: #22c55e; color: #000; }
        .score-badge.medium { background: #f59e0b; color: #000; }
        .score-badge.low { background: #64748b; color: #fff; }
        
        .grade-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
        }
        .grade-badge.a-plus { background: #22c55e; color: #000; }
        .grade-badge.a { background: #22c55e; color: #000; }
        .grade-badge.a-minus { background: #4ade80; color: #000; }
        .grade-badge.b-plus { background: #f59e0b; color: #000; }
        .grade-badge.b { background: #fbbf24; color: #000; }
        .grade-badge.b-minus { background: #64748b; color: #fff; }
        
        /* Data Row */
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1f3a;
            font-size: 13px;
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { color: #64748b; }
        .data-value { color: #e0e6ed; font-weight: 500; }
        .data-value.positive { color: #22c55e; }
        .data-value.negative { color: #ef4444; }
        
        /* Action Button */
        .action-btn {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn.primary {
            background: #3b82f6;
            color: #fff;
        }
        .action-btn.primary:hover { background: #2563eb; }
        .action-btn.success {
            background: #22c55e;
            color: #000;
        }
        .action-btn.success:hover { background: #16a34a; }
        .action-btn.danger {
            background: #ef4444;
            color: #fff;
        }
        .action-btn.danger:hover { background: #dc2626; }
        
        /* Contract Display */
        .contract-display {
            background: #1e293b;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 13px;
        }
        .contract-type { font-weight: 600; }
        .contract-type.call { color: #22c55e; }
        .contract-type.put { color: #ef4444; }
        
        /* Status Bar */
        .status-bar {
            background: #0f1629;
            border-top: 1px solid #1a1f3a;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #64748b;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }
        
        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px;
            color: #64748b;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 48px;
            color: #64748b;
        }
        .empty-state h3 {
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .nav-stats { display: none; }
            .card-grid { grid-template-columns: 1fr; }
        }
        
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="logo">
            ALPHA<span class="logo-accent">TRADES</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/launchcontrol" class="nav-link {% if active_page == 'launchcontrol' %}active{% endif %}">Launch Control</a>
            <a href="/overnight-gap" class="nav-link {% if active_page == 'overnight' %}active{% endif %}">Overnight Gap</a>
            <a href="/distress" class="nav-link {% if active_page == 'distress' %}active{% endif %}">Distress</a>
            <a href="/backtest" class="nav-link {% if active_page == 'backtest' %}active{% endif %}">Backtest</a>
        </div>
        <div class="nav-stats">
            {% block nav_stats %}{% endblock %}
        </div>
    </nav>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <div class="status-bar">
        <div class="status-indicator">
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">Connected</span>
        </div>
        <span id="lastUpdate">Last update: --</span>
    </div>
    
    {% block scripts %}{% endblock %}
</body>
</html>
