<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5 Backtest | AlphaTrades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        
        .nav-links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        
        .nav-links a {
            color: #60a5fa;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .nav-links a:hover {
            background: #1e293b;
            border-color: #60a5fa;
        }
        
        .backtest-form {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
        }
        
        .ticker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .ticker-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .ticker-checkbox input {
            width: auto;
        }
        
        button {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .results {
            display: none;
        }
        
        .results.visible {
            display: block;
        }
        
        .summary-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        
        .summary-item {
            text-align: center;
        }
        
        .summary-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .summary-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .positive {
            color: #10b981;
        }
        
        .negative {
            color: #ef4444;
        }
        
        .ticker-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .ticker-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .ticker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .ticker-name {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .ticker-stat {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #334155;
        }
        
        .ticker-stat:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #94a3b8;
        }
        
        .stat-value {
            font-weight: 600;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
        }
        
        .loading.visible {
            display: block;
        }
        
        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #60a5fa;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }
        
        .error.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 V5 Strategy Backtest</h1>
            <p class="subtitle">Test 15 tech stocks with professional trading rules • Alpaca Premium Data</p>
        </header>
        
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/backtest">Backtest</a>
        </div>
        
        <div class="backtest-form">
            <h2 style="margin-bottom: 1.5rem;">Backtest Configuration</h2>
            
            <div class="form-group">
                <label>Select Tickers</label>
                <div class="ticker-grid">
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="AMD" checked>
                        <span>AMD</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="NVDA" checked>
                        <span>NVDA</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="TSLA" checked>
                        <span>TSLA</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="AAPL">
                        <span>AAPL</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="MSFT">
                        <span>MSFT</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="GOOGL">
                        <span>GOOGL</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="AMZN">
                        <span>AMZN</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="META">
                        <span>META</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="NFLX">
                        <span>NFLX</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="AVGO">
                        <span>AVGO</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="ORCL">
                        <span>ORCL</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="ADBE">
                        <span>ADBE</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="CRM">
                        <span>CRM</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="INTC">
                        <span>INTC</span>
                    </label>
                    <label class="ticker-checkbox">
                        <input type="checkbox" value="QCOM">
                        <span>QCOM</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Strategy</label>
                <select id="strategy">
                    <option value="momentum" selected>V5 Momentum (100-Point Scoring)</option>
                    <option value="earnings" disabled>Earnings Catalyst (Coming Soon)</option>
                    <option value="reversal" disabled>Mean Reversion (Coming Soon)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Entry Threshold</label>
                <select id="threshold">
                    <option value="B">B (70+)</option>
                    <option value="B+" selected>B+ (75+)</option>
                    <option value="A-">A- (80+)</option>
                    <option value="A">A (85+)</option>
                    <option value="A+">A+ (90+)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Starting Capital</label>
                <input type="number" id="startingCapital" value="600" min="100" step="100" placeholder="Starting capital ($)">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="startDate" value="2025-03-01">
                </div>
                
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="endDate" value="2026-03-01">
                </div>
            </div>
            
            <button onclick="runBacktest()">Run Backtest</button>
            
            <div class="error" id="error"></div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Running backtest... This may take 1-2 minutes</p>
        </div>
        
        <div class="results" id="results">
            <div class="summary-card">
                <h2 style="margin-bottom: 1.5rem;">Summary</h2>
                <div class="summary-grid" id="summaryGrid"></div>
            </div>
            
            <h2 style="margin-bottom: 1rem;">Ticker Performance</h2>
            <div class="ticker-results" id="tickerResults"></div>
        </div>
    </div>
    
    <script>
        async function runBacktest() {
            const selectedTickers = Array.from(document.querySelectorAll('.ticker-checkbox input:checked'))
                .map(cb => cb.value);
            
            if (selectedTickers.length === 0) {
                showError('Please select at least one ticker');
                return;
            }
            
            const strategy = document.getElementById('strategy').value;
            const threshold = document.getElementById('threshold').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const startingCapital = parseInt(document.getElementById('startingCapital').value) || 600;
            
            // Hide results, show loading
            document.getElementById('results').classList.remove('visible');
            document.getElementById('error').classList.remove('visible');
            document.getElementById('loading').classList.add('visible');
            document.querySelector('button').disabled = true;
            
            try {
                const response = await fetch('/api/v5/backtest/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tickers: selectedTickers,
                        strategy: strategy,
                        threshold: threshold,
                        start_date: startDate,
                        end_date: endDate,
                        starting_capital: startingCapital
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    showError(data.error || 'Backtest failed');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('visible');
                document.querySelector('button').disabled = false;
            }
        }
        
        function displayResults(data) {
            // Display summary
            const summaryGrid = document.getElementById('summaryGrid');
            summaryGrid.innerHTML = `
                <div class="summary-item">
                    <div class="summary-label">Total Trades</div>
                    <div class="summary-value">${data.total_trades}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Win Rate</div>
                    <div class="summary-value ${data.win_rate >= 70 ? 'positive' : 'negative'}">
                        ${data.win_rate.toFixed(1)}%
                    </div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Total P&L</div>
                    <div class="summary-value ${data.total_pnl >= 0 ? 'positive' : 'negative'}">
                        $${data.total_pnl.toFixed(2)}
                    </div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Avg Win</div>
                    <div class="summary-value positive">$${data.avg_win.toFixed(2)}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Avg Loss</div>
                    <div class="summary-value negative">$${data.avg_loss.toFixed(2)}</div>
                </div>
                <div class="summary-item">
                    <div class="summary-label">Profit Factor</div>
                    <div class="summary-value">${data.profit_factor.toFixed(2)}</div>
                </div>
            `;
            
            // Display ticker results
            const tickerResults = document.getElementById('tickerResults');
            tickerResults.innerHTML = '';
            
            Object.entries(data.ticker_stats).forEach(([ticker, stats]) => {
                const card = document.createElement('div');
                card.className = 'ticker-card';
                card.innerHTML = `
                    <div class="ticker-header">
                        <div class="ticker-name">${ticker}</div>
                        <div class="${stats.total_pnl >= 0 ? 'positive' : 'negative'}">
                            $${stats.total_pnl.toFixed(2)}
                        </div>
                    </div>
                    <div class="ticker-stat">
                        <span class="stat-label">Trades</span>
                        <span class="stat-value">${stats.trades}</span>
                    </div>
                    <div class="ticker-stat">
                        <span class="stat-label">Win Rate</span>
                        <span class="stat-value ${stats.win_rate >= 70 ? 'positive' : 'negative'}">
                            ${stats.win_rate.toFixed(1)}%
                        </span>
                    </div>
                    <div class="ticker-stat">
                        <span class="stat-label">Avg Win</span>
                        <span class="stat-value positive">$${stats.avg_win.toFixed(2)}</span>
                    </div>
                    <div class="ticker-stat">
                        <span class="stat-label">Avg Loss</span>
                        <span class="stat-value negative">$${stats.avg_loss.toFixed(2)}</span>
                    </div>
                `;
                tickerResults.appendChild(card);
            });
            
            document.getElementById('results').classList.add('visible');
        }
        
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.add('visible');
        }
    </script>
</body>
</html>
